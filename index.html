<title>Agoraswipe — Brainscrolling</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="Doomscrolling yerine felsefe, tarih, sosyoloji, din ve kitaplardan hap bilgiler.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agoraswipe">
<style>
  :root{
    --ink:#0b0e14;          /* derin mürekkep zemini */
    --ink-2:#11151f;
    --marble:#ede6d6;       /* sıcak mermer/krem metin */
    --marble-dim:#b9b2a2;
    --line:rgba(237,230,214,.14);
    --acc:#c9a96a;          /* kart bazında override edilir */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  /* Bu prototip bilinçli olarak tek temadır: gece agorası. */
  html,body{margin:0;padding:0;background:var(--ink);color:var(--marble)}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}

  /* ---------- üst bar ---------- */
  .topbar{
    position:fixed;inset:0 0 auto 0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
    background:linear-gradient(to bottom,rgba(11,14,20,.85),rgba(11,14,20,0));
    pointer-events:none;
  }
  .wordmark{display:flex;align-items:baseline;gap:9px;pointer-events:auto}
  .wordmark .mark{
    width:24px;height:24px;align-self:center;
    stroke:var(--marble);fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;
  }
  .wordmark .name{font-family:var(--serif);font-size:20px;letter-spacing:.02em}
  .wordmark .name i{font-style:italic}
  .tagline{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--marble-dim)}

  .topbar-right{display:flex;align-items:center;gap:14px;pointer-events:auto}
  .streak{
    display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--marble-dim);
    font-variant-numeric:tabular-nums;
  }
  .streak b{color:var(--marble);font-weight:600}
  .libbtn{display:flex;padding:6px;margin:-6px;border-radius:8px}
  .libbtn svg{width:21px;height:21px;fill:none;stroke:var(--marble);stroke-width:1.7}
  .libbtn.has-saved svg{fill:var(--acc);stroke:var(--acc)}

  /* ---------- kütüphane paneli ---------- */
  .library{
    position:fixed;inset:0;z-index:80;background:rgba(11,14,20,.72);backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .28s ease;
  }
  .library.open{opacity:1;pointer-events:auto}
  .library-sheet{
    width:100%;max-height:82dvh;margin-top:auto;background:var(--ink-2);
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    display:flex;flex-direction:column;translate:0 16px;transition:translate .28s cubic-bezier(.2,.8,.2,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .library.open .library-sheet{translate:0 0}
  .library-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 22px 14px;border-bottom:1px solid var(--line);
  }
  .library-head h2{font-family:var(--serif);font-weight:500;font-size:21px;margin:0}
  .library-close{padding:8px;margin:-8px;border-radius:8px;color:var(--marble-dim);font-size:20px;line-height:1}
  .library-list{overflow-y:auto;padding:6px 12px 22px}
  .lib-item{
    width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;
    padding:13px 10px;border-radius:12px;border-bottom:1px solid var(--line);
  }
  .lib-item:last-child{border-bottom:0}
  .lib-item .lib-icon{font-size:18px;line-height:1;margin-top:2px}
  .lib-item .lib-body p{margin:0}
  .lib-item .lib-cat{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc-l,var(--marble-dim));margin-bottom:4px}
  .lib-item .lib-hook{font-family:var(--serif);font-size:15.5px;line-height:1.3}
  .library-empty{padding:48px 24px 12px;text-align:center;color:var(--marble-dim);font-size:14px;line-height:1.6}

  /* ---------- gün kapanışı kartı ---------- */
  .closing{
    align-items:center;text-align:center;justify-content:center;
    background:linear-gradient(var(--ink-2),var(--ink))!important;
  }
  .closing .mark{width:40px;height:40px;stroke:var(--acc);opacity:.85;margin-bottom:22px}
  .closing h2{font-family:var(--serif);font-weight:500;font-size:clamp(24px,5vw,32px);line-height:1.25;max-width:22ch;margin:0 0 12px;text-wrap:balance}
  .closing p{color:var(--marble-dim);font-size:14.5px;max-width:34ch;margin:0 0 30px;line-height:1.6}
  .closing button{
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--marble-dim);
    border-bottom:1px solid var(--line);padding-bottom:3px;
  }

  /* ---------- ilerleme rayı ---------- */
  .rail{
    position:fixed;right:8px;top:50%;translate:0 -50%;z-index:40;
    display:flex;flex-direction:column;gap:7px;
  }
  .rail span{
    width:3px;height:16px;border-radius:2px;background:rgba(237,230,214,.18);
    transition:background .35s,height .35s;
  }
  .rail span.on{background:var(--marble);height:26px}

  /* ---------- kartlar ---------- */
  .card{
    position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 max(24px,6vw) calc(56px + env(safe-area-inset-bottom));
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 18% 8%, color-mix(in srgb,var(--acc) 16%,transparent), transparent 60%),
      radial-gradient(110% 80% at 85% 100%, color-mix(in srgb,var(--acc) 9%,transparent), transparent 55%),
      linear-gradient(var(--ink-2),var(--ink));
  }
  .ghost{ /* kategorinin Yunanca hayalet harfi: derinlik katmanı */
    position:absolute;right:-2%;top:4%;z-index:1;pointer-events:none;
    font-family:var(--serif);font-size:min(46vh,64vw);line-height:1;
    color:color-mix(in srgb,var(--acc) 60%,transparent);opacity:.07;
    user-select:none;
  }
  .card::after{ /* zar zor görünür doku: agora taşı */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(rgba(237,230,214,.9) .6px,transparent .6px);
    background-size:26px 26px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    margin-bottom:auto;margin-top:calc(84px + env(safe-area-inset-top));
    padding:7px 14px 7px 10px;border-radius:999px;
    border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);
    background:color-mix(in srgb,var(--acc) 12%,transparent);
    font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
    color:color-mix(in srgb,var(--acc) 70%,var(--marble));
  }
  .content{max-width:34rem;padding-right:76px;position:relative;z-index:2}
  .kicker{
    font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:color-mix(in srgb,var(--acc) 75%,var(--marble));margin:0 0 14px;
  }
  .hook{
    font-family:var(--serif);font-weight:500;text-wrap:balance;
    font-size:clamp(30px,6.2vw,46px);line-height:1.12;letter-spacing:-.01em;
    margin:0 0 18px;
  }
  .pill-text{font-size:clamp(15.5px,2.2vw,17.5px);line-height:1.65;color:var(--marble);opacity:.92;margin:0 0 20px;max-width:60ch}
  .source{
    display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--marble-dim);
  }
  .source::before{content:"";width:26px;height:1px;background:var(--acc);flex:none}

  /* kart giriş animasyonu */
  .content>*{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
  .card.live .content>*{opacity:1;transform:none}
  .card.live .content>*:nth-child(2){transition-delay:.08s}
  .card.live .content>*:nth-child(3){transition-delay:.16s}
  .card.live .content>*:nth-child(4){transition-delay:.24s}
  .card.live .chip{opacity:1;transform:none}
  .chip{opacity:0;transform:translateY(-14px);transition:opacity .6s,transform .6s}

  /* ---------- aksiyon rayı ---------- */
  .actions{
    position:absolute;right:max(14px,3vw);bottom:calc(56px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:22px;z-index:3;
  }
  .act{display:flex;flex-direction:column;align-items:center;gap:5px}
  .act svg{width:30px;height:30px;fill:none;stroke:var(--marble);stroke-width:1.7;transition:transform .15s}
  .act small{font-size:11px;color:var(--marble-dim);font-variant-numeric:tabular-nums}
  .act:active svg{transform:scale(.82)}
  .act.liked svg{fill:#e0655f;stroke:#e0655f;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .act.saved svg{fill:var(--acc);stroke:var(--acc);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.3)}100%{transform:scale(1)}}

  /* çift dokunuş kalp patlaması */
  .burst{
    position:absolute;z-index:5;pointer-events:none;font-size:74px;translate:-50% -50%;
    animation:burst .8s ease forwards;
  }
  @keyframes burst{
    0%{opacity:0;transform:scale(.4) rotate(-8deg)}
    25%{opacity:1;transform:scale(1.15) rotate(3deg)}
    100%{opacity:0;transform:scale(1.5) translateY(-70px)}
  }

  /* kaydırma ipucu */
  .hint{
    position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));translate:-50% 0;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--marble-dim);
    display:flex;flex-direction:column;align-items:center;gap:4px;
    animation:bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));translate:-50% 16px;
    z-index:60;background:var(--marble);color:var(--ink);font-size:13.5px;
    padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s,translate .3s;
    pointer-events:none;
  }
  .toast.show{opacity:1;translate:-50% 0}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
    .content>*,.chip{opacity:1;transform:none}
  }
</style>

<header class="topbar">
  <div class="wordmark">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">

      <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>

      <button class="library-close" id="libClose" aria-label="Kapat">✕</button>
    </div>
    <div class="library-list" id="libList"></div>
  </div>
</div>

<script>
const DATA = [
  {

    src:"MÖ 2560 → MÖ 30 → MS 1969"

  {
    cat:"Felsefe", glyph:"Φ", icon:"🏛️", acc:"#c9a96a", id:"stoacilik",
    kicker:"Stoacı sükûnetin sırrı",
    hook:"Huzursuzluğun tek kaynağı: kontrol edemediğini kontrol etmeye çalışmak.",
    text:"Epiktetos köle olarak doğdu ve özgürlüğün en net tanımını yaptı: bazı şeyler bize bağlıdır (yargılarımız, seçimlerimiz), bazıları değildir (bedenimiz, ünümüz, başkalarının davranışları). Stoacılığın tamamı bu tek ayrımın üstüne kurulur. Enerjini yanlış kefeye koyduğun her an, kaybettiğin andır.",
    src:"Epiktetos — Enkheiridion (yak. MS 125)"
  },
  {
    cat:"Din", glyph:"Θ", icon:"🕊️", acc:"#9a86c8", id:"eksen-cagi",
    kicker:"Tarihin en tuhaf tesadüfü",
    hook:"Buda, Konfüçyüs ve Sokrates neredeyse aynı yüzyılda yaşadı.",
    text:"MÖ 800–200 arasında, birbirinden habersiz coğrafyalarda insanlık aynı anda uyandı: Hindistan'da Buda, Çin'de Konfüçyüs ve Lao Tzu, İran'da Zerdüşt geleneği, İsrail'de peygamberler, Yunanistan'da filozoflar. Karl Jaspers bu döneme 'Eksen Çağı' dedi — bugün hâlâ o çağın sorularıyla yaşıyoruz.",

  },
  {

    text:"Neil Postman'ın meşhur karşılaştırması: 1984'te bizi acı yönetir, Cesur Yeni Dünya'da haz. Orwell bilginin bizden gizlenmesinden korkuyordu; Huxley ise bilginin önemsizlik denizinde boğulmasından. Postman'a göre kazanan Huxley oldu. Şu an bu uygulamada olman bile bunun kanıtı sayılır.",

  },
  {

  },
  {
    cat:"Sosyoloji", glyph:"Π", icon:"🌍", acc:"#4fa8a0", id:"dunbar-sayisi",
    kicker:"Beynindeki misafir listesi",
    hook:"Beynin en fazla 150 kişilik bir kasabaya göre tasarlandı.",
    text:"Antropolog Robin Dunbar, primatlarda beyin korteksinin büyüklüğü ile grup boyutu arasında ilişki buldu. İnsan için sınır: anlamlı ilişki sürdürebileceğimiz yaklaşık 150 kişi. Neolitik köyler, Roma birlikleri ve modern şirket ekipleri hep bu sayının etrafında kümelenir. 5000 takipçin olabilir; kabilen hâlâ 150 kişi.",
    src:"Robin Dunbar — 'Dunbar Sayısı' (1992)"
  },
  {
    cat:"Tarih", glyph:"Χ", icon:"📜", acc:"#c2764f", id:"gobekli-tepe",
    kicker:"Her şeyi tersine çeviren kazı",

const feed = document.getElementById('feed');
const rail = document.getElementById('rail');
const toast = document.getElementById('toast');
const streakEl = document.getElementById('streak');
const libBtn = document.getElementById('libOpen');
const library = document.getElementById('library');
const libList = document.getElementById('libList');

const icons = {
  heart:'<svg viewBox="0 0 24 24"><path d="M12 21c-5.5-4.1-9-7.3-9-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 3.7-3.5 6.9-9 11z"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  share:'<svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>'
};

/* ---------- kalıcı durum (localStorage) ---------- */
function lsArr(key){ try{ return JSON.parse(localStorage.getItem(key)) || []; }catch{ return []; } }
function lsSet(key, arr){ try{ localStorage.setItem(key, JSON.stringify(arr)); }catch{} }

let savedIds = lsArr('agoraswipe:saved');
let likedIds = lsArr('agoraswipe:liked');

/* ---------- günlük seri ---------- */
(function trackStreak(){
  const todayStr = new Date().toISOString().slice(0,10);
  const last = localStorage.getItem('agoraswipe:lastVisit');
  let streak = parseInt(localStorage.getItem('agoraswipe:streak') || '0', 10);
  if(last !== todayStr){
    const y = new Date(); y.setDate(y.getDate()-1);
    streak = (last === y.toISOString().slice(0,10)) ? streak+1 : 1;
    localStorage.setItem('agoraswipe:lastVisit', todayStr);
    localStorage.setItem('agoraswipe:streak', String(streak));
  } else if(streak === 0){
    streak = 1;
    localStorage.setItem('agoraswipe:streak', '1');
  }
  if(streak >= 1){
    streakEl.innerHTML = `🔥 <b>${streak}</b> gün`;
    streakEl.hidden = false;
  }
})();

/* ---------- bugünün agorası: her gün farklı 5 kart ---------- */
const dayIndex = Math.floor(Date.now() / 86400000) % DATA.length;
const rotated = DATA.slice(dayIndex).concat(DATA.slice(0, dayIndex));
const today5 = rotated.slice(0, Math.min(5, DATA.length));
const rest = rotated.slice(today5.length);

function cardSection(d, isFirst){
  const s = document.createElement('section');
  s.className = 'card';
  s.dataset.id = d.id;
  s.style.setProperty('--acc', d.acc);
  const isLiked = likedIds.includes(d.id);
  const isSaved = savedIds.includes(d.id);
  s.innerHTML = `
    <span class="ghost" aria-hidden="true">${d.glyph}</span>
    <span class="chip"><span aria-hidden="true">${d.icon}</span> ${d.cat}</span>
    <div class="content">
      <p class="kicker">${d.kicker}</p>
      <h2 class="hook">${d.hook}</h2>
      <p class="pill-text">${d.text}</p>
      <p class="source">${d.src}</p>
    </div>
    <div class="actions">
      <button class="act like${isLiked?' liked':''}" aria-label="Beğen">${icons.heart}<small>${(Math.random()*4+1.2).toFixed(1)}b</small></button>
      <button class="act bookmark${isSaved?' saved':''}" aria-label="Kaydet">${icons.save}<small>Kaydet</small></button>
      <button class="act share" aria-label="Paylaş">${icons.share}<small>Paylaş</small></button>
    </div>
    ${isFirst?'<div class="hint">Kaydır<span aria-hidden="true">↓</span></div>':''}`;
  return s;
}

function closingSection(){
  const s = document.createElement('section');
  s.className = 'card closing';
  s.innerHTML = `
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 9 L57 29 H7 Z"/><path d="M15 37 V51 M32 37 V51 M49 37 V51"/><path d="M9 57 H55"/></svg>
    <h2>Bugünlük Agora'yı tamamladın.</h2>
    <p>Beş hap bilgi, düşünmeye yeter. Yarın yeni bir seçki seni bekliyor — seri devam ediyor.</p>
    <button id="keepGoing">Yine de devam et</button>`;
  return s;
}

today5.forEach((d,i)=> feed.appendChild(cardSection(d, i===0)));
feed.appendChild(closingSection());
rest.forEach(d=> feed.appendChild(cardSection(d, false)));

document.getElementById('keepGoing').addEventListener('click', ()=>{
  const closing = document.querySelector('.closing');
  const next = closing.nextElementSibling;
  if(next) next.scrollIntoView({behavior:'smooth'});
});

for(const _ of document.querySelectorAll('.card')) rail.appendChild(document.createElement('span'));

const cards = [...document.querySelectorAll('.card')];
const dots = [...rail.children];

/* aktif kart takibi */
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('live');
      dots.forEach((d,i)=>d.classList.toggle('on', cards[i]===e.target));
    }
  });
},{threshold:.6});
cards.forEach(c=>io.observe(c));

/* aksiyonlar */
let toastTimer;
function say(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
}
function like(card, on=true){
  const btn = card.querySelector('.like');
  if(on) btn.classList.add('liked'); else btn.classList.toggle('liked');
  const id = card.dataset.id;
  const isOn = btn.classList.contains('liked');
  likedIds = isOn ? [...new Set([...likedIds, id])] : likedIds.filter(x=>x!==id);
  lsSet('agoraswipe:liked', likedIds);
}

function renderLibrary(){
  libBtn.classList.toggle('has-saved', savedIds.length > 0);
  if(!savedIds.length){
    libList.innerHTML = `<p class="library-empty">Henüz bir şey kaydetmedin.<br>Bir kartı beğenip bookmark'a dokun, burada seni beklesin.</p>`;
    return;
  }
  libList.innerHTML = savedIds.map(id=>{
    const d = DATA.find(x=>x.id===id);
    if(!d) return '';
    return `<button class="lib-item" data-id="${id}">
      <span class="lib-icon" aria-hidden="true">${d.icon}</span>
      <span class="lib-body">
        <p class="lib-cat" style="color:${d.acc}">${d.cat}</p>
        <p class="lib-hook">${d.hook}</p>
      </span>
    </button>`;
  }).join('');
}
renderLibrary();

libBtn.addEventListener('click', ()=>{ library.classList.add('open'); library.setAttribute('aria-hidden','false'); });
document.getElementById('libClose').addEventListener('click', closeLibrary);
library.addEventListener('click', e=>{ if(e.target===library) closeLibrary(); });
function closeLibrary(){ library.classList.remove('open'); library.setAttribute('aria-hidden','true'); }

libList.addEventListener('click', e=>{
  const item = e.target.closest('.lib-item');
  if(!item) return;
  closeLibrary();
  const target = feed.querySelector(`.card[data-id="${item.dataset.id}"]`);
  setTimeout(()=> target?.scrollIntoView({behavior:'smooth'}), 200);
});

feed.addEventListener('click', e=>{
  const btn = e.target.closest('.act');
  if(!btn) return;
  const card = btn.closest('.card');
  const id = card.dataset.id;
  if(btn.classList.contains('like')) like(card, false);
  else if(btn.classList.contains('bookmark')){
    btn.classList.toggle('saved');
    const isOn = btn.classList.contains('saved');
    savedIds = isOn ? [id, ...savedIds.filter(x=>x!==id)] : savedIds.filter(x=>x!==id);
    lsSet('agoraswipe:saved', savedIds);
    renderLibrary();
    say(isOn ? 'Kütüphanene kaydedildi' : 'Kayıt kaldırıldı');
  }
  else{
    const d = DATA.find(x=>x.id===id);
    const payload = `${d.hook} — Agoraswipe`;
    if(navigator.share){ navigator.share({text:payload}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(payload).then(()=>say('Panoya kopyalandı')); }
    else say('Paylaşım hazır');
  }
});

/* çift dokunuş → kalp patlaması */
let lastTap = 0, lastCard = null;
feed.addEventListener('pointerup', e=>{
  if(e.target.closest('.act') || e.target.closest('#keepGoing')) return;
  const card = e.target.closest('.card');
  if(!card || card.classList.contains('closing')) return;
  const now = Date.now();
  if(now - lastTap < 350 && card === lastCard){
    like(card, true);
    const h = document.createElement('span');
    h.className = 'burst';
    h.textContent = '🤍';
    const r = card.getBoundingClientRect();
    h.style.left = (e.clientX - r.left) + 'px';
    h.style.top  = (e.clientY - r.top) + 'px';
    card.appendChild(h);
    setTimeout(()=>h.remove(), 850);
  }
  lastTap = now; lastCard = card;
});

/* klavye ile gezinme */
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
  e.preventDefault();
  const idx = dots.findIndex(d=>d.classList.contains('on'));
  const next = Math.min(Math.max(idx + (e.key==='ArrowDown'?1:-1), 0), cards.length-1);
  cards[next].scrollIntoView({behavior:'smooth'});
});

/* PWA: çevrimdışı önbellek. Kendi sunduğun bir originde çalışır; */
/* artifact önizlemesinde sessizce devre dışı kalır. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
